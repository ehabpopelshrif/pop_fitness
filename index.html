<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0e0e">
<title>لوحة التحكم | Captain POP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #0e0e0e;
    --panel: #171717;
    --panel-2: #1f1f1f;
    --line: #2b2b2b;
    --orange: #ff4d00;
    --ember: #ff7a2f;
    --text: #f5f2ee;
    --muted: #a8a29a;
    --display: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }
  :focus-visible { outline: 3px solid var(--ember); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 18px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--display); font-weight: 800; font-size: .95rem;
    padding: 10px 20px; border-radius: 999px; border: 1.5px solid var(--line);
    background: var(--panel); color: var(--text); cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .btn:hover { border-color: #555; }
  .btn-primary { background: var(--orange); border-color: var(--orange); color: #fff; }
  .btn-primary:hover { background: var(--ember); border-color: var(--ember); }
  .btn[disabled] { opacity: .6; cursor: wait; }

  /* ---------- login ---------- */
  .login {
    min-height: 100svh; display: grid; place-items: center; padding: 20px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,77,0,.22), transparent 60%), var(--ink);
  }
  .card {
    width: 100%; max-width: 400px; padding: 32px 26px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 24px; text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .card h1 { font-family: var(--display); font-weight: 900; font-size: 1.9rem; margin: 0 0 4px; }
  .card p { color: var(--muted); margin: 0 0 22px; }
  .card input {
    width: 100%; padding: 14px 16px; margin-bottom: 12px; color: var(--text);
    background: var(--ink); border: 1.5px solid var(--line); border-radius: 12px;
  }
  .card input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,77,0,.25); }
  .card .btn { width: 100%; }
  .msg { min-height: 1.4em; margin: 12px 0 0; font-size: .92rem; color: #ff7b7b; }

  /* ---------- dashboard ---------- */
  header.bar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14,14,14,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar-in { display: flex; align-items: center; gap: 10px; padding: 12px 0; flex-wrap: wrap; }
  .bar-in h1 { font-family: var(--display); font-weight: 900; font-size: 1.35rem; margin: 0; margin-inline-end: auto; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 14px; text-align: center; }
  .stat b { display: block; font-family: var(--display); font-weight: 900; font-size: 2rem; line-height: 1.2; color: var(--orange); }
  .stat span { color: var(--muted); font-size: .9rem; }

  .tools { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .tools input {
    flex: 1; min-width: 200px; padding: 11px 16px; color: var(--text);
    background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px;
  }
  .tools input:focus { outline: none; border-color: var(--orange); }

  .list { display: grid; gap: 10px; padding-bottom: 60px; }
  .item {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  }
  .who { flex: 1; min-width: 180px; }
  .who strong { display: block; font-weight: 600; font-size: 1.05rem; }
  .who small { color: var(--muted); }
  .phone { direction: ltr; font-family: var(--display); font-weight: 600; letter-spacing: .5px; }
  .acts { display: flex; gap: 8px; }
  .chip {
    padding: 6px 14px; border-radius: 999px; border: 1px solid #454545; background: transparent;
    color: var(--text); font-size: .88rem; font-weight: 600; cursor: pointer;
  }
  .chip:hover { border-color: var(--ember); color: var(--ember); }
  .chip.wa { background: #1ea952; border-color: #1ea952; color: #fff; }
  .chip.wa:hover { background: #22c15d; border-color: #22c15d; color: #fff; }

  .empty { text-align: center; color: var(--muted); padding: 50px 0; }

  @media (max-width: 560px) {
    .stat b { font-size: 1.6rem; }
    .acts { width: 100%; }
    .acts .chip { flex: 1; text-align: center; }
  }
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div class="login" id="login">
  <div class="card">
    <h1>لوحة التحكم</h1>
    <p>اكتب كلمة السر عشان تشوف المسجلين</p>
    <form id="login-form">
      <input id="key" type="password" placeholder="كلمة السر" autocomplete="current-password" dir="ltr" style="text-align:right">
      <button class="btn btn-primary" type="submit" id="login-btn">دخول</button>
    </form>
    <div class="msg" id="login-msg" role="alert"></div>
  </div>
</div>

<!-- ========== DASHBOARD ========== -->
<div id="app" hidden>
  <header class="bar">
    <div class="wrap bar-in">
      <h1>المسجلين في الموقع</h1>
      <button class="btn" id="refresh" type="button">تحديث</button>
      <button class="btn" id="csv" type="button">تحميل Excel</button>
      <button class="btn" id="logout" type="button">خروج</button>
    </div>
  </header>

  <main class="wrap">
    <div class="stats">
      <div class="stat"><b id="s-total">0</b><span>إجمالي المسجلين</span></div>
      <div class="stat"><b id="s-today">0</b><span>النهاردة</span></div>
      <div class="stat"><b id="s-week">0</b><span>آخر 7 أيام</span></div>
    </div>

    <div class="tools">
      <input id="search" type="search" placeholder="ابحث بالاسم أو الرقم">
    </div>

    <div class="msg" id="app-msg" role="alert"></div>
    <div class="list" id="list"></div>
  </main>
</div>

<script>
  // نفس رابط Apps Script المستخدم في الموقع
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbwF4zQtAMnEG-TbxPKNd83Sv2o7erH8TiZurrm25RLTHVNRC0wFfHZTyLp4QHtWZA2f/exec";

  var KEY_STORE = 'captainpop_admin_key';
  var rows = [];

  var $ = function (id) { return document.getElementById(id); };

  // ===== تحميل البيانات (JSONP عشان نتجنب مشاكل CORS) =====
  function load(key, cb) {
    var name = 'cb_' + Date.now();
    var script = document.createElement('script');
    var done = false;

    var timer = setTimeout(function () {
      if (done) return;
      done = true; cleanup();
      cb({ ok: false, error: 'timeout' });
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[name] = function (data) {
      if (done) return;
      done = true; cleanup();
      cb(data);
    };

    script.onerror = function () {
      if (done) return;
      done = true; cleanup();
      cb({ ok: false, error: 'network' });
    };

    script.src = ENDPOINT + '?action=list&key=' + encodeURIComponent(key) +
                 '&callback=' + name + '&t=' + Date.now();
    document.head.appendChild(script);
  }

  function errorText(code) {
    if (code === 'bad_key') return 'كلمة السر غلط';
    if (code === 'timeout') return 'الرد اتأخر. اتأكد من الإنترنت وإن كود Apps Script اتحدّث ونُشر كنسخة جديدة.';
    return 'مقدرتش أوصل للبيانات. اتأكد إن كود Apps Script اتحدّث ونُشر كنسخة جديدة.';
  }

  // ===== عرض =====
  function fmt(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString('ar-EG', { timeZone: 'Africa/Cairo', dateStyle: 'medium', timeStyle: 'short' });
  }

  function waLink(phone) {
    return 'https://wa.me/2' + phone.replace(/^0/, '0').replace(/\D/g, '');
  }

  function render() {
    var q = $('search').value.trim().toLowerCase();
    var list = $('list');
    list.innerHTML = '';

    var shown = rows.filter(function (r) {
      return !q || r.name.toLowerCase().indexOf(q) > -1 || r.phone.indexOf(q) > -1;
    });

    if (!shown.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = rows.length ? 'مفيش نتايج للبحث ده' : 'لسه محدش سجل';
      list.appendChild(e);
      return;
    }

    shown.forEach(function (r) {
      var item = document.createElement('div');
      item.className = 'item';

      var who = document.createElement('div');
      who.className = 'who';
      var n = document.createElement('strong'); n.textContent = r.name;
      var t = document.createElement('small'); t.textContent = fmt(r.time);
      who.appendChild(n); who.appendChild(t);

      var ph = document.createElement('div');
      ph.className = 'phone'; ph.textContent = r.phone;

      var acts = document.createElement('div');
      acts.className = 'acts';

      var wa = document.createElement('a');
      wa.className = 'chip wa'; wa.textContent = 'واتساب';
      wa.href = waLink(r.phone); wa.target = '_blank'; wa.rel = 'noopener';

      var call = document.createElement('a');
      call.className = 'chip'; call.textContent = 'اتصال';
      call.href = 'tel:' + r.phone;

      var copy = document.createElement('button');
      copy.className = 'chip'; copy.type = 'button'; copy.textContent = 'نسخ';
      copy.addEventListener('click', function () {
        var ok = function () { copy.textContent = 'تم ✓'; setTimeout(function () { copy.textContent = 'نسخ'; }, 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(r.phone).then(ok);
        else { var x = document.createElement('textarea'); x.value = r.phone; document.body.appendChild(x); x.select(); document.execCommand('copy'); document.body.removeChild(x); ok(); }
      });

      acts.appendChild(wa); acts.appendChild(call); acts.appendChild(copy);
      item.appendChild(who); item.appendChild(ph); item.appendChild(acts);
      list.appendChild(item);
    });
  }

  function stats() {
    var now = Date.now();
    var startToday = new Date(); startToday.setHours(0, 0, 0, 0);
    var today = 0, week = 0;
    rows.forEach(function (r) {
      var ts = new Date(r.time).getTime();
      if (ts >= startToday.getTime()) today++;
      if (now - ts <= 7 * 864e5) week++;
    });
    $('s-total').textContent = rows.length;
    $('s-today').textContent = today;
    $('s-week').textContent = week;
  }

  function apply(data) {
    rows = (data.rows || []).slice().sort(function (a, b) { return new Date(b.time) - new Date(a.time); });
    stats(); render();
  }

  // ===== دخول / خروج =====
  function enter(key, fromLogin) {
    var btn = $('login-btn');
    if (fromLogin) { btn.disabled = true; btn.textContent = 'جاري التحقق…'; $('login-msg').textContent = ''; }

    load(key, function (data) {
      btn.disabled = false; btn.textContent = 'دخول';
      if (!data.ok) {
        try { sessionStorage.removeItem(KEY_STORE); } catch (e) {}
        $('login').hidden = false; $('app').hidden = true;
        $('login-msg').textContent = errorText(data.error);
        return;
      }
      try { sessionStorage.setItem(KEY_STORE, key); } catch (e) {}
      $('login').hidden = true; $('app').hidden = false;
      $('app-msg').textContent = '';
      apply(data);
    });
  }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var k = $('key').value;
    if (!k) { $('login-msg').textContent = 'اكتب كلمة السر'; return; }
    enter(k, true);
  });

  $('refresh').addEventListener('click', function () {
    var btn = $('refresh'); btn.disabled = true; btn.textContent = 'جاري التحديث…';
    var k = ''; try { k = sessionStorage.getItem(KEY_STORE) || ''; } catch (e) {}
    load(k, function (data) {
      btn.disabled = false; btn.textContent = 'تحديث';
      if (!data.ok) { $('app-msg').textContent = errorText(data.error); return; }
      $('app-msg').textContent = '';
      apply(data);
    });
  });

  $('logout').addEventListener('click', function () {
    try { sessionStorage.removeItem(KEY_STORE); } catch (e) {}
    rows = []; $('key').value = '';
    $('app').hidden = true; $('login').hidden = false;
  });

  $('search').addEventListener('input', render);

  // ===== تحميل ملف Excel (CSV) =====
  $('csv').addEventListener('click', function () {
    var esc = function (s) { return '"' + String(s).replace(/"/g, '""') + '"'; };
    var lines = ['الوقت,الاسم,الرقم'];
    rows.forEach(function (r) {
      lines.push([esc(fmt(r.time)), esc(r.name), '="' + r.phone + '"'].join(','));
    });
    var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'captain-pop-leads.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  // لو الجلسة لسه مفتوحة، ادخل على طول
  try {
    var saved = sessionStorage.getItem(KEY_STORE);
    if (saved) enter(saved, false);
  } catch (e) {}
</script>
</body>
</html>
